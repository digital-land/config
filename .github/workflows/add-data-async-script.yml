name: Add Data From Async Results

on:
  repository_dispatch:
    types: [add-data-async-script]
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Request ID from async API'
        required: true
        type: string
      triggered_by:
        description: 'Identifier for the actor/system that triggered this run'
        required: true
        type: string
      branch:
        description: 'Git branch to use (optional)'
        required: false
        type: string
      environment:
        description: 'Async results environment'
        required: false
        type: choice
        default: 'staging'
        options:
          - 'development'
          - 'staging'
          - 'production'
      retire_endpoints:
        description: 'Comma-separated endpoint strings to retire (optional)'
        required: false
        type: string
      unretire_endpoints:
        description: 'Comma-separated endpoint strings to unretire, i.e. clear the end-date (optional)'
        required: false
        type: string
      test:
        description: 'Run in test mode (creates draft PR)'
        required: false
        type: boolean
        default: false

jobs:
  fetch-and-append:
    runs-on: ubuntu-latest
    environment: ${{ github.event.client_payload.environment || github.event.inputs.environment || 'staging' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEPLOY_AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install click pandas boto3

      - name: Run add-data script
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REQUEST_ID: ${{ github.event.client_payload.request_id || github.event.inputs.request_id }}
          BRANCH_PARAM: ${{ github.event.client_payload.branch || github.event.inputs.branch }}
          TRIGGERED_BY: ${{ github.event.client_payload.triggered_by || github.event.inputs.triggered_by }}
          ENVIRONMENT: ${{ github.event.client_payload.environment || github.event.inputs.environment || 'staging' }}
          RETIRE_ENDPOINTS: ${{ github.event.client_payload.retire_endpoints || github.event.inputs.retire_endpoints }}
          UNRETIRE_ENDPOINTS: ${{ github.event.client_payload.unretire_endpoints || github.event.inputs.unretire_endpoints }}
          TEST_MODE: ${{ github.event.inputs.test }}
          REQUEST_DETAILS_BUCKET_NAME: ${{ secrets.REQUEST_DETAILS_BUCKET_NAME }}
        run: |
          ARGS=(
            --request-id "$REQUEST_ID"
            --triggered-by "$TRIGGERED_BY"
          )

          if [ -n "$BRANCH_PARAM" ]; then
            ARGS+=(--branch "$BRANCH_PARAM")
          fi

          ARGS+=(--environment "$ENVIRONMENT")

          if [ -n "$RETIRE_ENDPOINTS" ]; then
            ARGS+=(--retire-endpoints "$RETIRE_ENDPOINTS")
          fi

          if [ -n "$UNRETIRE_ENDPOINTS" ]; then
            ARGS+=(--unretire-endpoints "$UNRETIRE_ENDPOINTS")
          fi

          if [ "$TEST_MODE" = "true" ]; then
            ARGS+=(--test)
          fi

          python3 bin/add_data.py "${ARGS[@]}"
